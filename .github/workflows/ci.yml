name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  nix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check
      - run: nix build

  app:
    # Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Universal, as releases are built.
      - run: UNIVERSAL=1 ./scripts/build-app.sh
      - run: codesign --verify --strict --deep target/Obojeno.app
      - run: |
          test "$(lipo -archs target/Obojeno.app/Contents/MacOS/Obojeno | tr " " "\n" | sort | xargs)" = "arm64 x86_64"
          test "$(lipo -archs target/Obojeno.app/Contents/Helpers/obojeno | tr " " "\n" | sort | xargs)" = "arm64 x86_64"
      - run: swift test --package-path app
      - name: Cask style
        run: |
          ./scripts/cask.sh 0.0.0 "$(printf '0%.0s' {1..64})" > "$RUNNER_TEMP/obojeno.rb"
          brew style "$RUNNER_TEMP/obojeno.rb"
