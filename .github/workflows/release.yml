name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish
# Obojeno.app as a GitHub release, with the update feed (appcast.xml) that
# downloaded copies of the app update themselves from.
#
# Required secret:
#   SPARKLE_PRIVATE_KEY  the private EdDSA key that signs updates and the
#     feed (`generate_keys --account obojeno -x FILE` exports it); the app
#     only accepts updates signed with it
#
# Optional secrets:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD  Developer ID Application
#     certificate as base64 .p12, and its password: sign with it
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarize (needs the above)
#   TAP_TOKEN  a token that can push to st1vc3/homebrew-tap: update the cask
# Without them the app is signed ad hoc and the cask is left alone.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # Each secret goes only to the steps that use it, never to the job: the
    # build runs every dependency's build script, and a leaked update key
    # would let anyone sign updates that every installed app accepts. The
    # job only knows which secrets are set.
    env:
      HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      # Third-party code runs here with the job's token, so actions are
      # pinned to commits (Dependabot updates them).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All tags and history, for the release notes.
          fetch-depth: 0

      - name: Require the update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set: installed apps could not update to this release"
            exit 1
          fi

      - name: Check the tag against Cargo.toml
        run: |
          version="$(./scripts/version.sh)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # Ours first, then the existing ones (one quoted path per line).
          security list-keychains -d user | sed 's/^ *"\(.*\)"$/\1/' | tr '\n' '\0' \
            | xargs -0 security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Check the version
        run: test "$(target/Obojeno.app/Contents/Helpers/obojeno --version)" = "obojeno $VERSION"

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && env.HAS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent target/Obojeno.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple target/Obojeno.app
          echo "NOTARIZED=--notarized" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir dist
          zip="dist/Obojeno-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent target/Obojeno.app "$zip"
          (cd dist && shasum -a 256 "Obojeno-$VERSION.zip" > "Obojeno-$VERSION.zip.sha256")
          echo "SHA256=$(cut -d' ' -f1 "dist/Obojeno-$VERSION.zip.sha256")" >> "$GITHUB_ENV"

      - name: Release notes
        # The commits since the previous release; changes land on main
        # directly, so there are no pull requests to list.
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # sign_update from the Sparkle version the app is built with.
          sparkle="$(sed -n 's/.*"version" : "\(.*\)".*/\1/p' app/Package.resolved | head -1)"
          gh release download "$sparkle" -R sparkle-project/Sparkle -p "Sparkle-$sparkle.tar.xz" -D "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle-$sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update" ./scripts/appcast.sh "$VERSION" \
            "dist/Obojeno-$VERSION.zip" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Obojeno-$VERSION.zip" \
            "$RUNNER_TEMP/notes.md" dist/appcast.xml

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "obojeno $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update the Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/st1vc3/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          ./scripts/cask.sh "$VERSION" "$SHA256" ${NOTARIZED:+"$NOTARIZED"} > "$RUNNER_TEMP/tap/Casks/obojeno.rb"
          ./scripts/check-cask.sh "$RUNNER_TEMP/tap/Casks/obojeno.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/obojeno.rb
          git commit -m "obojeno $VERSION"
          git push
