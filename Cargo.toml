[workspace]
resolver = "3"
members = ["crates/obojeno-core", "crates/obojeno"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/st1vc3/obojeno"
rust-version = "1.97"

[workspace.dependencies]
obojeno-core = { path = "crates/obojeno-core" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
insta = "1.49.0"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSScreen"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFData", "CFString", "CFDictionary"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGGeometry"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString", "NSURL", "NSUserDefaults"] }
material-colors = { version = "0.5.0", features = ["quantize", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
upon = { version = "0.11.0", features = ["serde", "functions"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
