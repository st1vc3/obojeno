# cargo-deny: licenses, security advisories and crate sources, checked in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# obojeno only builds for macOS; other platforms' crates never ship.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses, compatible with shipping under MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true
# Splits between dependencies, not fixable here. cargo-deny says when one is
# no longer needed.
skip = [
    { crate = "getrandom@0.3", reason = "ahash (through image) is behind tempfile" },
    { crate = "miniz_oxide@0.8", reason = "png is behind flate2" },
    { crate = "syn@2", reason = "derive macros are moving to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
