name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots or a screen recording help with anything visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick a wallpaper from the gallery
        2. ...
  - type: input
    id: version
    attributes:
      label: obojeno version
      description: "`obojeno --version`, or About in the menu bar app."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options: [Homebrew, Nix, Downloaded app, Built from source]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of `~/Library/Logs/obojeno.log` (⋯ → Show Log in the menu bar app).
      render: text
