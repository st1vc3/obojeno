name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    # Licenses, security advisories and crate sources (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  nix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check
      - run: nix build
      - run: nix shell nixpkgs#shellcheck -c shellcheck scripts/*.sh
      - run: nix shell nixpkgs#actionlint nixpkgs#shellcheck -c actionlint

  app:
    # Liquid Glass needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: swift format lint --strict -r app/Sources app/Tests app/Icon
      # Universal, as releases are built; the script verifies the result.
      - run: UNIVERSAL=1 ./scripts/build-app.sh
      - run: swift test --package-path app
      - name: Cask style
        run: |
          for notarized in "" --notarized; do
            ./scripts/cask.sh 0.0.0 "$(printf '0%.0s' {1..64})" $notarized > "$RUNNER_TEMP/obojeno.rb"
            ./scripts/check-cask.sh "$RUNNER_TEMP/obojeno.rb"
          done
